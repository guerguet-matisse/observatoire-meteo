name: Python checks

on:
  push:
    branches: [main, feature/interactive-weather-map]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests requests-cache pillow
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q .
